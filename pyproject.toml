[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-control"
version = "0.1.0"
description = "Local-first control plane for OpenCode projects, agents, sessions, MCP servers and skills"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "croniter>=6,<7",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-croniter>=6.2.4,<7",
]

[project.scripts]
opencode-control = "opencode_control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_control"]
artifacts = ["src/opencode_control/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/opencode_control/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "SIM", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
